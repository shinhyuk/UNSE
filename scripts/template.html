<title>영지와 신혁의 운세</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 터미널 세션처럼 한 줄 폭의 단일 칼럼. 프롬프트 줄 → 날짜와 일진 → 탭 → 풀이 블록. */
:root {
  --bg: #e8dbc4; --surface: #f1e6d3; --ink: #2d1e13; --muted: #6a5441; --line: #cbb696;
  --accent: #a94f2a; --accent-soft: #e2c9a8; --track: #d9c7a9;
  --wood: #55702f; --fire: #ad3b26; --earth: #8f6218; --metal: #6f675c; --water: #2b4f66;
  --good: #55702f; --care: #ad3b26;
  --mono: 'JetBrains Mono', 'Nanum Gothic Coding', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --hanja: 'Noto Serif KR', 'Nanum Myeongjo', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b130e; --surface: #251a13; --ink: #ead9bf; --muted: #a68d73; --line: #45342a;
  --accent: #e08a5f; --accent-soft: #3a281d; --track: #33251b;
  --wood: #a3bd72; --fire: #ea7a60; --earth: #d6a551; --metal: #cdc4b5; --water: #86b0ca;
  --good: #a3bd72; --care: #ea7a60; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b130e; --surface: #251a13; --ink: #ead9bf; --muted: #a68d73; --line: #45342a;
  --accent: #e08a5f; --accent-soft: #3a281d; --track: #33251b;
  --wood: #a3bd72; --fire: #ea7a60; --earth: #d6a551; --metal: #cdc4b5; --water: #86b0ca;
  --good: #a3bd72; --care: #ea7a60; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 16px; line-height: 1.9; word-break: keep-all; overflow-wrap: anywhere }
.wrap { max-width: 780px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px }
p { margin: 0 } h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }

.cmd { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline }
.prompt { color: var(--accent); font-weight: 700 }
.cmd b { color: var(--ink); font-weight: 500 }
.spark { color: var(--accent) }

.dates { display: flex; flex-wrap: wrap; gap: 6px }
.dates button { padding: 2px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 13px }
.dates button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.day { display: flex; flex-direction: column; gap: 18px }
.dateline { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px }
.dateline h1 { font-size: 24px; letter-spacing: -0.02em; line-height: 1.3 }
.dateline h1 span { color: var(--muted); font-size: 15px; font-weight: 400 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px }
.chip small { color: var(--muted); font-size: 12px }
.chip .g { font-size: 19px }
.chip.term { font-weight: 700 }
.g { font-family: var(--hanja); font-weight: 700; line-height: 1 }
.wood { color: var(--wood) } .fire { color: var(--fire) } .earth { color: var(--earth) } .metal { color: var(--metal) } .water { color: var(--water) }
.g.unknown { color: var(--line) }

.headline { font-size: 18px; font-weight: 700; line-height: 1.6; text-wrap: balance }
.headline::before { content: '✻ '; color: var(--accent) }
.daynote { color: var(--muted); max-width: 62ch }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5 }
.tabs button { padding: 10px 18px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent) }
.tabs button[aria-selected="true"]::before { content: '❯ '; color: var(--accent) }

.panel { display: flex; flex-direction: column; gap: 28px }
.who { display: flex; flex-direction: column; gap: 4px }
.who-name { display: flex; align-items: center; gap: 14px }
.hanja { font-family: var(--hanja); font-size: 34px; font-weight: 700; color: var(--accent); line-height: 1.1 }
.who-name strong { display: block; font-size: 17px }
.who-name small { color: var(--muted); font-size: 12.5px }
.who-meta { color: var(--muted); font-size: 13px }
.lede { font-size: 17px; max-width: 62ch }
.lede.small { font-size: 15.5px; color: var(--muted) }
.keywords { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px }
.keywords li { padding: 1px 10px; background: var(--accent-soft); border-radius: 4px; font-size: 13px }
.keywords li::before { content: '#'; color: var(--accent) }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px }
.grid2 > * { min-width: 0 }
.block { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.block h3 { font-size: 16px; color: var(--accent); letter-spacing: 0.02em }
.block h3::before { content: '## '; opacity: .6 }
.block p { max-width: 62ch }
.block p + p { margin-top: 12px }
.caution { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px }

.scores, .elements { display: flex; flex-direction: column; gap: 6px }
.score, .el { display: grid; grid-template-columns: 6em 1fr 2.5em; gap: 10px; align-items: center }
.el { grid-template-columns: 3em 1fr 2.5em }
.score-k { font-size: 14px }
.score-v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700 }
.bar { height: 10px; background: var(--track); border-radius: 2px; overflow: hidden; display: block }
.bar i { display: block; height: 100%; background: var(--accent); background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--track) 6px 8px) }
.el-k { font-weight: 700 }
.el-bar i { background-color: currentColor }

.today-god { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px }
.today-god .g { font-size: 24px }
.today-god span:last-child { font-weight: 700 }
.rel, .plain, .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px }
.rel li { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; font-size: 13px; align-items: baseline }
.rel em { font-style: normal; color: var(--muted) }
.tag { text-align: center; font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted) }
.t-충, .t-형, .t-천간충, .t-자형, .t-해, .t-원진, .t-파, .t-공망 { color: var(--care); border-color: currentColor }
.t-육합, .t-반합, .t-천간합, .t-신살 { color: var(--good); border-color: currentColor }
.t-복음 { color: var(--accent); border-color: currentColor }
.plain li { font-size: 14px; padding-left: 1.2em; text-indent: -1.2em }
.plain li::before { content: '· '; color: var(--accent) }

.timeline li { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line) }
.tl-time { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700 }
.points li { font-size: 15px }
.tl-pillar .g { font-size: 17px }
.tl-note b { font-size: 12px; margin-right: 4px }
.tone-good b { color: var(--good) } .tone-care b { color: var(--care) } .tone-neutral b { color: var(--muted) }

.lucky { margin: 0; display: flex; flex-direction: column; gap: 4px }
.lucky div { display: grid; grid-template-columns: 6em 1fr; gap: 10px }
.lucky dt { color: var(--muted); font-size: 13px } .lucky dd { margin: 0 }

details { border-top: 1px dashed var(--line); padding-top: 8px }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 0 }
details[open] > summary { color: var(--ink); margin-bottom: 10px }
details > .block + .block { margin-top: 18px }

.natal { display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 16px; margin-top: 8px }
.natal h2 { font-size: 15px }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px }
.pillars { table-layout: fixed; min-width: 300px; text-align: center }
.pillars th { font-weight: 400; color: var(--muted); padding: 4px }
.pillars tbody th { width: 4.5em; text-align: left; font-size: 12px }
.pillars td { padding: 4px; border-left: 1px solid var(--line) }
.pillars .big .g { font-size: 38px; line-height: 1.25 }
.pillars thead th { border-bottom: 1px solid var(--line) }
.hours { min-width: 560px }
.hours th { text-align: left; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0 }
.hours td { padding: 5px 8px 5px 0; border-bottom: 1px dashed var(--line); vertical-align: baseline; white-space: nowrap }
.hours td.marks { white-space: normal; color: var(--muted); font-size: 12px; min-width: 14em }
.hours .g { font-size: 16px }

.weather { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; max-width: 62ch }
.score-wrap { display: flex; flex-direction: column; gap: 0 }
.score-note { font-size: 13.5px; color: var(--muted); padding-left: calc(6em + 10px) }
.todo .block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.check li { padding-left: 1.6em; text-indent: -1.6em }
.do .check li::before { content: '✓ '; color: var(--good); font-weight: 700 }
.dont .check li::before { content: '✕ '; color: var(--care); font-weight: 700 }
.do h3 { color: var(--good) } .dont h3 { color: var(--care) }
.examples { border-left: 3px solid var(--accent-soft); padding: 4px 0 4px 14px; margin-top: 6px; max-width: 62ch }
.examples > span { font-size: 13px; font-weight: 700; color: var(--accent) }
.examples ul { margin: 4px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px }
.examples li::marker { color: var(--accent) }

footer { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 6px }
footer ul { margin: 0; padding-left: 1.2em }
@media (max-width: 480px) {
  body { font-size: 15.5px } .dateline h1 { font-size: 21px } .tabs button { padding: 10px 12px } .pillars .big .g { font-size: 30px }
  .timeline li { grid-template-columns: 1fr }
}
</style>

<div class="wrap">
  <div class="cmd"><span><span class="prompt">❯</span> <b>unse</b> --who 김영지,전신혁 --date {{LATEST}}</span><span><span class="spark">✻</span> 매일 아침 6시에 새로 씁니다</span></div>
  {{DATENAV}}
  {{DAYS}}
  <footer>
    <ul>{{NOTES}}</ul>
    <p>운세는 하루를 돌아보는 재미로 읽어 주세요. 중요한 결정의 근거로 삼지는 마세요.</p>
  </footer>
</div>

<script>
(function () {
  var store = { get: function (k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set: function (k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
  function showTab(name) {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === name)) });
    document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.dataset.panel !== name });
  }
  function showDate(date) {
    document.querySelectorAll('.day').forEach(function (d) { d.hidden = d.dataset.date !== date });
    document.querySelectorAll('.dates button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.date === date)) });
  }
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('.tabs button'), date = e.target.closest('.dates button');
    if (tab) { showTab(tab.dataset.tab); store.set('unse-tab', tab.dataset.tab) }
    if (date) showDate(date.dataset.date);
  });
  var saved = store.get('unse-tab');
  if (saved && document.querySelector('.panel[data-panel="' + saved + '"]')) showTab(saved);
})();
</script>
