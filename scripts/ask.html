<section class="ask" id="ask">
  <h2><span class="prompt">❯</span> 궁금한 것 물어보기</h2>
  <p class="muted">두 사람의 사주와 오늘 운세를 바탕으로 Claude가 답합니다. 예: 오늘 회의는 몇 시가 좋을까?</p>
  <div class="ask-chips">
    <button type="button" data-q="오늘 회사에서 중요한 이야기를 꺼내려면 몇 시가 좋을까?">회사에서 말 꺼내기 좋은 시간</button>
    <button type="button" data-q="오늘 저녁에 부부가 같이 하면 좋은 일을 추천해 줘.">오늘 저녁 뭐 하지</button>
    <button type="button" data-q="이번 주에 큰돈 쓰는 결정을 해도 괜찮을까?">돈 쓰는 결정</button>
  </div>
  <div class="ask-log" id="ask-log" aria-live="polite"></div>
  <form class="ask-form" id="ask-form">
    <label class="sr" for="ask-input">질문</label>
    <textarea id="ask-input" rows="2" placeholder="질문을 적어 주세요" required></textarea>
    <button type="submit" id="ask-send">묻기</button>
  </form>
  <p class="ask-status muted" id="ask-status" role="status"></p>
  <details id="ask-settings">
    <summary>API 키 설정</summary>
    <div class="ask-key">
      <label for="ask-key">Anthropic API 키</label>
      <input id="ask-key" type="password" autocomplete="off" placeholder="sk-ant-..." spellcheck="false">
      <button type="button" id="ask-key-save">저장</button>
      <button type="button" id="ask-key-clear">지우기</button>
    </div>
    <p class="muted">키는 이 기기의 브라우저에만 저장되고, 질문할 때 Anthropic으로만 보냅니다. 이 페이지나 저장소에는 올라가지 않습니다. 질문할 때마다 본인 키로 요금이 나갑니다. 함께 쓰는 기기에서는 다 쓴 뒤 지워 주세요.</p>
  </details>
</section>
